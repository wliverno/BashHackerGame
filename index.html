<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Megafirm Quantum Research Lab</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jquery.terminal@2.45.2/css/jquery.terminal.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="terminal"></div>

  <div id="mobile-input-bar" style="display:none;">
    <span id="mobile-prompt"></span>
    <input id="mobile-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    <button id="mobile-send">↵</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery.terminal@2.45.2/js/jquery.terminal.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
